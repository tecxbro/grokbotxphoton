name: Grokbot x Photon checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: node packages/photon-features/scripts/generate-skill.mjs --check
      - run: npm run smoke
