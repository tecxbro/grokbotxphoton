name: Photon product checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci --ignore-scripts
      - run: npm run photon:verify-all
      - run: npm run smoke
